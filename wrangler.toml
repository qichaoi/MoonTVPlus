# wrangler.toml
name = 'qilianmoontvpro'
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = "./cloudflare-worker.ts"
minify = true

# 静态资源配置
# Cloudflare Workers Assets 用于服务静态文件
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "qiliantvpro"
database_id = "1a312f54-beb1-44ce-ad79-f433b783d49f"

# 观影室的 Durable Object。
# 单个 hub DO 装下所有房间：客户端是先建连、后 emit room:create/join，
# 建连那一刻拿不到 roomId，所以没法按房间做 idFromName 路由。
[[durable_objects.bindings]]
name = "WATCH_ROOM"
class_name = "WatchRoomHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WatchRoomHub"]

# 定时任务（对齐 vercel.json 的 "0 1 * * *"）。
# 触发器要想生效，入口必须导出 scheduled —— 见 cloudflare-worker.ts。
[triggers]
crons = ["0 1 * * *"]

# 注意：[vars] 必须留在文件最后。
# cloudflare-deploy.yml 是用 `echo >> wrangler.toml` 追加环境变量的，
# 追加的变量会落在文件末尾 —— 只有 [vars] 在最后它们才会进 [vars]。
[vars]
# cron 路由等任务真正结束再返回（CF 上不需要 Vercel 那套"先返回 202 再后台跑"）
ANNOUNCEMENT = "本站仅提供影视信息搜索服务，视频内容来自第三方平台。请注意识别视频中的赌博、投资、游戏代练等广告信息，这些都是第三方添加的，本站无法控制。请勿轻信，谨防受骗！再次强调！本站不存储任何视频资源，不对任何内容的准确性、合法性、完整性负责！官方主站：https://qichao.pages.dev/"
BUILD_TARGET = "cloudflare"
CRON_WAIT_FOR_COMPLETION = "true"
NEXT_PUBLIC_ENABLE_REGISTER = "true"
NEXT_PUBLIC_STORAGE_TYPE = "d1"
NODE_ENV = "production"
SITE_NAME = "奇廉TV"
